<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="docs/favicon.svg" type="image/svg+xml">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>motd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="term">
    <div class="term__line">
      <label class="term__prompt" for="cmd" id="path"></label>
      <div class="cmd-wrap">
        <span class="cmd-ghost" id="cmd-ghost" aria-hidden="true"></span>
        <input id="cmd" class="cmd" autocomplete="off" spellcheck="false" autofocus
               placeholder="type help" aria-label="command">
      </div>
      <span class="badge" id="demo-badge" hidden>demo</span>
      <button class="btn" id="settings-btn">[settings]</button>
    </div>
    <pre class="term__output" id="output" aria-live="polite"></pre>
  </header>

  <main class="grid">
    <section class="card card--wide" id="clock"></section>
    <section class="card" id="progress"></section>
    <section class="card" id="deadlines"></section>
    <section class="card" id="weather"></section>
    <section class="card" id="links"></section>
    <section class="card card--wide" id="activity"></section>
  </main>

  <dialog id="settings">
    <form method="dialog" class="settings">
      <h2>settings</h2>

      <label>name
        <input name="username" maxlength="20" autocomplete="off">
      </label>

      <label>city
        <input name="city" autocomplete="off">
      </label>

      <label>deadlines <span class="muted">// date | title, one per line</span>
        <textarea name="deadlines" rows="4" placeholder="2026-12-25 | exam"></textarea>
      </label>

      <label>links <span class="muted">// title | url, one per line</span>
        <textarea name="links" rows="4" placeholder="github | github.com"></textarea>
      </label>

      <label>link brackets
        <select name="linkStyle">
          <option value="[]">[github]</option>
          <option value="{}">{github}</option>
        </select>
      </label>

      <label>prefixes <span class="muted">// key | url with %s, one per line</span>
        <textarea name="prefixes" rows="3" placeholder="so | https://stackoverflow.com/search?q=%s"></textarea>
      </label>

      <label>github <span class="muted">// username for the activity grid</span>
        <input name="github" autocomplete="off" placeholder="aoqyy">
      </label>

      <div class="settings__row">
        <button type="button" class="btn" id="export-btn">[export]</button>
        <button type="button" class="btn" id="import-btn">[import]</button>
        <button type="button" class="btn" id="reset-btn">[reset]</button>
        <input type="file" id="import-file" accept=".json" hidden>
      </div>

      <div class="settings__row">
        <button value="cancel" class="btn">[cancel]</button>
        <button type="button" class="btn btn--main" id="save-btn">[save]</button>
      </div>
    </form>
  </dialog>

  <script src="data.example.js"></script>
  <script src="storage.js"></script>
  <script src="widgets/clock.js"></script>
  <script src="widgets/progress.js"></script>
  <script src="widgets/deadlines.js"></script>
  <script src="widgets/links.js"></script>
  <script src="widgets/weather.js"></script>
  <script src="widgets/activity.js"></script>
  <script src="widgets/summary.js"></script>
  <script src="app.js"></script>
  <script src="settings.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
