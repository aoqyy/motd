<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>start</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="path">
    <span id="path"></span><span class="cursor">_</span>
    <span class="badge" id="demo-badge" hidden>demo</span>
    <button class="btn" id="settings-btn">[settings]</button>
  </header>

  <main class="grid">
    <section class="card card--wide" id="clock"></section>
    <section class="card" id="progress"></section>
    <section class="card" id="deadlines"></section>
    <section class="card" id="weather"><h2>weather</h2><p class="muted">// soon</p></section>
    <section class="card" id="links"></section>
  </main>

  <dialog id="settings">
    <form method="dialog" class="settings">
      <h2>settings</h2>

      <label>name
        <input name="username" maxlength="20" autocomplete="off">
      </label>

      <label>city
        <input name="city" autocomplete="off">
      </label>

      <label>deadlines <span class="muted">// date | title, one per line</span>
        <textarea name="deadlines" rows="4" placeholder="2026-12-25 | exam"></textarea>
      </label>

      <label>links <span class="muted">// title | url, one per line</span>
        <textarea name="links" rows="4" placeholder="github | github.com"></textarea>
      </label>

      <div class="settings__row">
        <button type="button" class="btn" id="export-btn">[export]</button>
        <button type="button" class="btn" id="import-btn">[import]</button>
        <button type="button" class="btn" id="reset-btn">[reset]</button>
        <input type="file" id="import-file" accept=".json" hidden>
      </div>

      <div class="settings__row">
        <button value="cancel" class="btn">[cancel]</button>
        <button type="button" class="btn btn--main" id="save-btn">[save]</button>
      </div>
    </form>
  </dialog>

  <script src="data.example.js"></script>
  <script src="storage.js"></script>
  <script src="widgets/clock.js"></script>
  <script src="widgets/progress.js"></script>
  <script src="widgets/deadlines.js"></script>
  <script src="widgets/links.js"></script>
  <script src="app.js"></script>
  <script src="settings.js"></script>
</body>
</html>
